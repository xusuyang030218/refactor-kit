# RefactorKit 案例配置：DTS 重构（AISWare DataDiscovery）
# 由 `node bin/rk.mjs init` 探测生成后人工整理：填写了模型槽，收窄了写入范围，冒烟脚本改用 tests/smoke-test.ps1。
# 本文件放在插件仓库中，因此 targetRoot 用绝对路径；stateDir 指向本目录，避免在 DTS 仓库里留下账本文件。
# 在 DTS 仓库中正式使用时：复制为 D:\DTS\DTS-rebuild\refactorkit.yaml，删除 stateDir 与 targetRoot 两行即可。
version: 3

project:
  name: DTS 重构（AISWare DataDiscovery）
  legacyRoot: D:\DTS\d2d-ncore-cuc-datadiscover-repository   # 只读
  targetRoot: D:\DTS\DTS-rebuild
  stateDir: ./.run                                            # 账本位置（相对本文件）
  writeScope: [dts-server/**, dts-dashboard/**, tests/**, docs/**]
  memoryFiles: [dev-memory/INDEX.md, docs/91-CONTEXT.md]

# 模型槽：provider 是 DSH「设置 → 模型」中已配置的路由名
slots:
  fast:     { provider: aliyun-maas, model: qwen3.6-flash }
  strong:   { provider: anthropic,   model: claude-opus-5-5, reasoningEffort: high }
  reviewer:
    candidates:                      # rk_review 自动选第一个与实施者不同源的候选
      - { provider: gpt,         model: gpt-5.5 }
      - { provider: anthropic,   model: claude-opus-5-5 }
      - { provider: aliyun-maas, model: deepseek-v4-pro }

autonomy:
  default: assisted
  byModel:
    "anthropic/claude-opus-*": free
    "gpt/gpt-5.*": free
    "aliyun-maas/qwen3.6-flash": guided

review:
  preset: standard                   # 比赛演示建议改为 strict

gates:
  compile:   { command: "mvn -q -DskipTests compile", cwd: dts-server, kind: build }
  unit:      { command: "mvn -q test",                cwd: dts-server, kind: test }
  build-fe:  { command: "pnpm -r build",              cwd: dts-dashboard, kind: build }
  typecheck: { command: "pnpm -r typecheck",          cwd: dts-dashboard, kind: build }
  smoke:     { command: "powershell -ExecutionPolicy Bypass -File tests/smoke-test.ps1",  kind: api, expectPattern: "FAIL=0", sideEffect: true }

commandAllowlist:
  - git diff
  - git log
  - git status
  - mvn -q
  - pnpm -r build
  - pnpm -r typecheck
  - powershell -ExecutionPolicy Bypass -File tests/smoke-test.ps1

truth:
  weights: { java: 0.4, controller: 0.3, vue: 0.2, js: 0.1 }
  retired: []
